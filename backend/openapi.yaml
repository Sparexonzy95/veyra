components:
  schemas:
    CircleExchange:
      type: object
      properties:
        user_token:
          type: string
          minLength: 20
        circle_user_id:
          type: string
          maxLength: 255
        auth_method:
          $ref: '#/components/schemas/CircleExchangeAuthMethodEnum'
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        display_name:
          type: string
          maxLength: 120
      required:
      - auth_method
      - user_token
    CircleExchangeAuthMethodEnum:
      enum:
      - GOOGLE
      - EMAIL
      type: string
      description: |-
        * `GOOGLE` - Google
        * `EMAIL` - Email
    ClientOnboarding:
      type: object
      properties:
        organisation_name:
          type: string
          maxLength: 160
        notification_email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        timezone:
          type: string
          default: UTC
          maxLength: 64
        github_username:
          type: string
          maxLength: 80
    EmailRequest:
      type: object
      properties:
        device_id:
          type: string
          maxLength: 255
          minLength: 8
        email:
          type: string
          format: email
      required:
      - device_id
      - email
    GithubIssuePreview:
      type: object
      properties:
        github_issue_url:
          type: string
          format: uri
      required:
      - github_issue_url
    JobDraft:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        github_issue_url:
          type: string
          format: uri
          maxLength: 200
        repository_owner:
          type: string
          readOnly: true
        repository_name:
          type: string
          readOnly: true
        target_branch:
          type: string
          readOnly: true
        issue_number:
          type: integer
          readOnly: true
        issue_title:
          type: string
          readOnly: true
        issue_body:
          type: string
          readOnly: true
        budget_usdc:
          type: string
          format: decimal
          pattern: ^-?\d{0,24}(?:\.\d{0,6})?$
        deadline:
          type: string
          format: date-time
        acceptance_criteria: {}
        advanced_options: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - budget_usdc
      - created_at
      - deadline
      - github_issue_url
      - id
      - issue_body
      - issue_number
      - issue_title
      - repository_name
      - repository_owner
      - status
      - target_branch
      - updated_at
    JobSummary:
      type: object
      properties:
        onchain_job_id:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        title:
          type: string
        github_issue_url:
          type: string
          format: uri
        client_status:
          type: string
          maxLength: 32
        status:
          type: string
          maxLength: 24
        budget_usdc:
          type: string
          readOnly: true
        provider_address:
          type: string
          maxLength: 42
        expires_at:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - budget_usdc
      - client_status
      - expires_at
      - github_issue_url
      - onchain_job_id
      - status
      - title
      - updated_at
    PaginatedJobDraftList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/JobDraft'
    PaginatedJobSummaryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/JobSummary'
    PatchedJobDraft:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        github_issue_url:
          type: string
          format: uri
          maxLength: 200
        repository_owner:
          type: string
          readOnly: true
        repository_name:
          type: string
          readOnly: true
        target_branch:
          type: string
          readOnly: true
        issue_number:
          type: integer
          readOnly: true
        issue_title:
          type: string
          readOnly: true
        issue_body:
          type: string
          readOnly: true
        budget_usdc:
          type: string
