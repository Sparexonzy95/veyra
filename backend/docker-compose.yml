services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: veyra
      POSTGRES_USER: veyra
      POSTGRES_PASSWORD: veyra
    ports:
      - "5432:5432"
    volumes:
      - veyra_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veyra -d veyra"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  veyra_postgres:
